# Copyright The odrive-can-driver Contributors
# Standalone STM32H723 bench application; intentionally outside the published library package.

[package]
name = "odrive-h723-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# Controller-only self-test. This image never drives the external CAN pins.
internal-loopback = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.1"
embassy-stm32 = { version = "0.6.0", features = ["stm32h723vg", "time-driver-tim5"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-can = "0.4.1"
odrive_can_driver = { path = "../..", features = ["embassy-stm32"] }
panic-halt = "1.0.0"

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }

[profile.dev]
debug = 2
lto = true
opt-level = "s"

[profile.release]
debug = 2
codegen-units = 1
lto = true
opt-level = "s"
