# Copyright The odrive-can-driver Contributors
# 定义协议与驱动的单库发布元数据及三个可选收发后端。

[package]
name = "odrive_can_driver"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
description = "Allocation-free ODrive CANSimple codec and driver with optional CAN backends"
repository = "https://github.com/MRNIU/odrive-can-driver"
homepage = "https://github.com/MRNIU/odrive-can-driver"
documentation = "https://docs.rs/odrive_can_driver"
license = "MIT"
readme = "README.md"
keywords = ["odrive", "can", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
include = ["src/**", "tests/**", "examples/**", "README.md", "CONTRIBUTING.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[features]
default = []
embedded-can = ["dep:embedded-can", "dep:nb"]
embassy-stm32 = ["embedded-can", "dep:embassy-stm32"]
socketcan = ["embedded-can", "dep:socketcan"]

[dependencies]
embedded-can = { version = "0.4.1", optional = true }
nb = { version = "1.1", optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0.0", default-features = false, optional = true }

[dev-dependencies]
bxcan = "0.8.0"

# 修复 registry embassy-stm32 0.6.0 的 RTR DLC>0 发送缺陷。
# Cargo 不向下游传递 patch，Embassy 消费方必须在其 workspace 根采用 README.md 中的配置。
[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "7b08a9c7d9a9fe620f4be25c4e7b86dd29f09f54" }

[[example]]
name = "socketcan"
required-features = ["socketcan"]

[[example]]
name = "embedded_can"
crate-type = ["lib"]
required-features = ["embedded-can"]

[[example]]
name = "embassy_stm32"
crate-type = ["lib"]
required-features = ["embassy-stm32"]

[package.metadata.docs.rs]
features = ["embedded-can", "socketcan", "embassy-stm32", "embassy-stm32/stm32h723vg"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
